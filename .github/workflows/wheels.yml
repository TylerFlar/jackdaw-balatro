name: Wheels

# abi3 wheels (CPython 3.12+) for each platform, plus the sdist. On a release tag (vX.Y.Z) the
# tag must name the version, and the wheels go into a draft GitHub release to publish by hand
# (CONTRIBUTING.md). Nothing goes to PyPI.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: The manifests, the changelog and the tag agree
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            python scripts/check_version.py --tag "$REF_NAME"
          else
            python scripts/check_version.py
          fi

  linux:
    needs: version
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64
            pgo: true
          # Cross-compiled in maturin-action's container on the x86_64 runner: an aarch64
          # wheel can't run there to train a profile, so it builds without PGO.
          - target: aarch64
            pgo: false
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Profile-guided optimisation (scripts/pgo.sh, docs/development.md): an instrumented
      # wheel built in the same manylinux container as the release wheel, the training
      # workload on the runner, then the release build with the merged profile. The profile
      # matches functions by symbol name, which the toolchain, target and crate features fix:
      # the workload's rollout example is built for the same target with the same 1.98.1.
      # No sccache on PGO builds: it doesn't hash the profile's contents.
      - uses: dtolnay/rust-toolchain@master
        if: matrix.pgo
        with:
          toolchain: "1.98.1"
          components: llvm-tools

      - name: Build an instrumented wheel (PGO)
        if: matrix.pgo
        uses: PyO3/maturin-action@v1
        env:
          RUSTFLAGS: -Cprofile-generate=${{ github.workspace }}/target/pgo/default
        with:
          target: ${{ matrix.target }}
          manylinux: "2_28"
          args: --release --out target/pgo/instrumented
          sccache: false

      # scripts/pgo.sh installs the training workload's dependencies from uv.lock, by hash.
      - uses: astral-sh/setup-uv@v10.3.2
        if: matrix.pgo
        with:
          enable-cache: false

      - name: Train the profile (PGO)
        if: matrix.pgo
        run: scripts/pgo.sh train target/pgo/instrumented target/pgo/jackdaw.profdata

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        env:
          RUSTFLAGS: ${{ matrix.pgo && format('-Cprofile-use={0}/target/pgo/jackdaw.profdata', github.workspace) || '' }}
        with:
          target: ${{ matrix.target }}
          manylinux: "2_28"
          args: --release --out dist
          sccache: ${{ !matrix.pgo && !startsWith(github.ref, 'refs/tags/') }}

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-linux-${{ matrix.target }}
          path: dist

  macos:
    needs: version
    runs-on: macos-latest
    strategy:
      matrix:
        include:
          - target: aarch64
            pgo: true
          # Cross-compiled on the arm64 runner: the wheel can't run there to train a profile,
          # so it builds without PGO.
          - target: x86_64
            pgo: false
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # PGO as in the linux job; maturin-action builds on the runner itself here.
      - uses: dtolnay/rust-toolchain@master
        if: matrix.pgo
        with:
          toolchain: "1.98.1"
          components: llvm-tools

      - name: Build an instrumented wheel (PGO)
        if: matrix.pgo
        uses: PyO3/maturin-action@v1
        env:
          RUSTFLAGS: -Cprofile-generate=${{ github.workspace }}/target/pgo/default
        with:
          target: ${{ matrix.target }}
          args: --release --out target/pgo/instrumented
          sccache: false

      # scripts/pgo.sh installs the training workload's dependencies from uv.lock, by hash.
      - uses: astral-sh/setup-uv@v10.3.2
        if: matrix.pgo
        with:
          enable-cache: false

      - name: Train the profile (PGO)
        if: matrix.pgo
        run: scripts/pgo.sh train target/pgo/instrumented target/pgo/jackdaw.profdata

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        env:
          RUSTFLAGS: ${{ matrix.pgo && format('-Cprofile-use={0}/target/pgo/jackdaw.profdata', github.workspace) || '' }}
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          sccache: ${{ !matrix.pgo && !startsWith(github.ref, 'refs/tags/') }}

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-macos-${{ matrix.target }}
          path: dist

  windows:
    # Release wheels use the MSVC toolchain.
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          architecture: x64

      # PGO as in the linux job; maturin-action builds on the runner itself here.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          components: llvm-tools

      - name: Build an instrumented wheel (PGO)
        uses: PyO3/maturin-action@v1
        env:
          RUSTFLAGS: -Cprofile-generate=${{ github.workspace }}/target/pgo/default
        with:
          target: x64
          args: --release --out target/pgo/instrumented
          sccache: false

      # scripts/pgo.sh installs the training workload's dependencies from uv.lock, by hash.
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: false

      - name: Train the profile (PGO)
        shell: bash
        run: scripts/pgo.sh train target/pgo/instrumented target/pgo/jackdaw.profdata

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        env:
          RUSTFLAGS: -Cprofile-use=${{ github.workspace }}/target/pgo/jackdaw.profdata
        with:
          target: x64
          args: --release --out dist
          # No sccache here: wrapping cl.exe, it breaks the C build of mimalloc (C1083 on
          # '/WX-').
          sccache: false

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-windows-x64
          path: dist

  sdist:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-sdist
          path: dist

  release:
    # A draft: it shows on the releases page only once someone publishes it.
    if: github.ref_type == 'tag'
    needs: [linux, macos, windows, sdist]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          python scripts/check_version.py --tag "$TAG" --notes > notes.md
          gh release create "$TAG" dist/* --draft --verify-tag \
            --title "jackdaw ${TAG#v}" --notes-file notes.md
