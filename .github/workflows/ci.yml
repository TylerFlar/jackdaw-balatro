name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true

      # Ruff needs only the dev tools, so skip building the Rust extension.
      - run: uv sync --dev --no-install-project
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .

  lint-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo xtask codegen --check

  test-rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"

      - uses: Swatinem/rust-cache@v2

      - run: cargo test --workspace --exclude jackdaw-py --locked

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      # `uv sync` builds the jackdaw._core extension with maturin.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"

      - uses: Swatinem/rust-cache@v2
        with:
          key: py${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true

      - run: uv python install ${{ matrix.python-version }}
      - run: uv sync --dev --python ${{ matrix.python-version }}

      - name: Run tests
        run: uv run pytest --cov=jackdaw --cov-report=term-missing

      - name: Coverage summary
        if: always()
        run: uv run pytest --cov=jackdaw --cov-report=markdown >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
