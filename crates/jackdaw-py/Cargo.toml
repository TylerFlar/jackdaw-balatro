[package]
name = "jackdaw-py"
description = "PyO3 bindings for jackdaw: the jackdaw._core extension module"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
jackdaw-bot.workspace = true
jackdaw-core.workspace = true
jackdaw-env.workspace = true
# The extension's global allocator: engine steps clone the game, and with many threads
# (BalatroVectorEnv) the system allocator becomes the bottleneck.
mimalloc = { version = "0.1.52", default-features = false, optional = true }
pyo3 = { version = "0.30.1", features = ["abi3-py312"] }
serde_json.workspace = true

[features]
default = ["mimalloc"]

[lints]
workspace = true
